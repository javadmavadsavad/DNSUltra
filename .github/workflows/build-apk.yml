name: Build DNS Tunnel APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      domain:
        description: 'Tunnel Domain (e.g. tunnel.example.com)'
        required: true
        default: 'tunnel.example.com'
      resolver:
        description: 'DNS Resolver IP'
        required: true
        default: '1.1.1.1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install Gradle
        run: sudo apt-get update && sudo apt-get install -y gradle

      - name: Generate Project Files & Config
        env:
          TUNNEL_DOMAIN: ${{ github.event.inputs.domain || 'tunnel.example.com' }}
          RESOLVER_IP: ${{ github.event.inputs.resolver || '1.1.1.1' }}
          SECRET_KEY: "BrandNewSecureKey2026#"
        run: python3 inject_config.py

      - name: Build APK with Gradle
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DNSTunnel-App
          path: app/build/outputs/apk/debug/app-debug.apk
